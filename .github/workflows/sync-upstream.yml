name: 从 xoqnapgf-dot/chop 同步

# 给复制了这个仓库的账号用：定时（或手动点一下）把源仓库的 main 合并进来，再触发部署。
# 源仓库自己不会运行（见下面的 if）。
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'xoqnapgf-dot/chop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 合并源仓库的 main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/xoqnapgf-dot/chop.git main
          before=$(git rev-parse HEAD)
          git merge --no-edit -m "同步 xoqnapgf-dot/chop" FETCH_HEAD
          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo "没有新内容"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # 用 GITHUB_TOKEN 推送不会自动触发其他工作流，所以这里手动触发一次部署
      - name: 触发部署
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.event.repository.default_branch }}"
